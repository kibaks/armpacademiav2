name: Build Academia engine image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: academia-engine-image
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free space for the two pinned CUDA runtimes
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the ready-to-run CPU-built image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: deploy/huggingface/musetalk
          platforms: linux/amd64
          push: true
          tags: ghcr.io/kibaks/academia-engines:${{ github.sha }}
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/kibaks/armpacademiav2
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record immutable deployment image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ghcr.io/kibaks/academia-engines@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

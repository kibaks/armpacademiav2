[program:academia-initiation-expiry]
command=/bin/bash /workspace/academia/initiation-expiry/start.sh
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/workspace/academia/logs/initiation-expiry.log
stderr_logfile=/workspace/academia/logs/initiation-expiry-error.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB

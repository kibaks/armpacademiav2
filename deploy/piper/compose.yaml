services:
  piper:
    build: .
    container_name: academia-piper
    restart: unless-stopped
    ports:
      - "127.0.0.1:8060:8000"
    env_file: .env
    mem_limit: 768m
    memswap_limit: 1g
    cpus: 1.0
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
